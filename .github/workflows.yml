name: Build AEON Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Debug or Release)'
        default: 'Release'
        required: true
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-android:
    runs-on: windows-latest
    strategy:
      matrix:
        format: [apk, aab]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-net@v4
        with:
          dotnet-version: '10.0'

      - name: Install Android SDK
        uses: actions/setup-android@v4

      - name: Restore dependencies
        run: dotnet restore src/Aeon.App/Aeon.App.csproj

      - name: Build Android ${{ matrix.format.upper() }}
        run: |
          if ${{ matrix.format == 'apk' ]]; then
            dotnet publish src/Aeon.App/Aeon.App.csproj \
              -c ${{ github.event.inputs.configuration }} -r android-arm64 \
              --self-contained true \
              -p:AndroidPackageFormat=apk \
              -p:OutputDir=./artifacts/
          else
            dotnet publish src/Aeon.App/Aeon.App.csproj \
              -c ${{ github.event.inputs.configuration }} -r android-arm64 \
              --self-contained true \
              -p:AndroidPackageFormat=aab \
              -p:OutputDir=./artifacts/
          fi

      - name: Sign APK (Release only)
        if: matrix.format == 'apk' && github.event.inputs.configuration == 'Release'
        run: |
          mkdir -p .android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > .android/keystore.jks
          dotnet publish src/Aeon.App/Aeon.App.csproj \
            -c Release -r android-arm64 \
            --self-contained true \
            -p:AndroidPackageFormat=apk \
            -p:OutputDir=./artifacts/ \
            -p:AndroidSigningKeyStore=.android/keystore.jks \
            -p:AndroidSigningKeyAlias=alias_name \
            -p:AndroidSigningKeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidSigningStorePassword=${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: aeon-app-${{ matrix.format }}
          path: artifacts/**/*.${{ matrix.format }}

      - name: Create GitHub Release
        if: github.ref == 'refs/main' && github.event_name == 'push' && github.event.inputs.configuration == 'Release'
        uses: softprops/gh-action-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AEON Android v1.0.${{ github.run_number }}"
          body: |
            ## AEON Android App Release
            
            ### Build Configuration: Release
            
            ### Artifacts
            - **APK**: Release-mode signed Android Package Kit
            - **AAB**: Android App Bundle (for Google Play Store)
            
            ### What's Built
            - dotnet MAUI Android app with Release configuration
            - Android ARM64 architecture
            - Self-contained .NET runtime included
          
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}