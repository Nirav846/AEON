name: Build AEON Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Debug or Release)'
        default: 'Release'
        required: true
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        format: [apk, aab]
    env:
      # Empty on fork PRs / if secrets are not set -> the build falls back to unsigned
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore src/Aeon.App/Aeon.App.csproj

      - name: Decode keystore
        if: env.CONFIG == 'Release' && env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Publish signed Release
        if: env.CONFIG == 'Release' && env.KEYSTORE_B64 != ''
        run: dotnet publish src/Aeon.App/Aeon.App.csproj -c Release -f net10.0-android -r android-arm64 -p:AndroidPackageFormat=${{ matrix.format }} -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=True -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/keystore.jks" -p:AndroidSigningKeyAlias="$KEY_ALIAS" -p:AndroidSigningKeyPass="$KEY_PASS" -p:AndroidSigningStorePass="$STORE_PASS" -o ./artifacts

      - name: Publish unsigned / Debug
        if: env.CONFIG == 'Debug' || env.KEYSTORE_B64 == ''
        run: dotnet publish src/Aeon.App/Aeon.App.csproj -c ${{ env.CONFIG }} -f net10.0-android -r android-arm64 -p:AndroidPackageFormat=${{ matrix.format }} -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=True -o ./artifacts

      - name: Keep only signed files when both exist
        run: if ls artifacts/*-Signed.${{ matrix.format }} >/dev/null 2>&1; then find artifacts -name '*.${{ matrix.format }}' ! -name '*-Signed.${{ matrix.format }}' -delete; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeon-app-${{ matrix.format }}
          path: artifacts/**/*.${{ matrix.format }}
          if-no-files-found: error

  release:
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AEON Android v1.0.${{ github.run_number }}
          body: |
            AEON Android release (.NET MAUI, android-arm64)
            APK: package for sideloading
            AAB: Android App Bundle for Google Play
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}