<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  NRV monogram - adaptive icon foreground.

  Letters are drawn as explicit filled paths rather than <text> elements on
  purpose: MAUI rasterises the SVG through SkiaSharp, which does not reliably
  resolve <text> (font substitution would silently change the letterforms
  between machines). Paths render identically everywhere.

  Geometry is a condensed geometric sans, cap height 150 on a 456x456 canvas:
    N  x130-186   R  x200-256   V  x270-326   baseline y290, cap top y140
  All three letters sit inside the adaptive-icon safe zone (centre ~66%), so no
  launcher mask will clip them.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- N: left stem, right stem, diagonal -->
    <path fill="#FFFFFF" fill-rule="nonzero" d="M130,140 L154,140 L154,290 L130,290 Z
                                            M162,140 L186,140 L186,290 L162,290 Z
                                            M154,140 L178,140 L186,290 L162,290 Z" />
    <!-- R: stem, bowl (evenodd so the counter punches through), leg -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="M200,140 L224,140 L224,290 L200,290 Z
                                            M224,140 L256,140 L256,215 L224,215 Z
                                            M224,164 L232,164 L232,191 L224,191 Z
                                            M224,215 L248,215 L256,290 L232,290 Z" />
    <!-- V: two converging diagonals -->
    <path fill="#FFFFFF" fill-rule="nonzero" d="M270,140 L294,140 L310,290 L286,290 Z
                                            M302,140 L326,140 L310,290 L286,290 Z" />
    <!-- accent rule, the same violet as the app chrome -->
    <rect x="178" y="318" width="100" height="5" rx="2.5" fill="#8B7CF6" />
</svg>